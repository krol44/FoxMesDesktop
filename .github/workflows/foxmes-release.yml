        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CACHE_KEY" > "$TBUILD/foxmes-deps-key.txt"
          tar -czf macos-deps.tar.gz -C "$TBUILD" Libraries ThirdParty foxmes-deps-key.txt
      - name: Upload macos-deps
        id: prepared-deps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intermediate-macos-deps
          path: macos-deps.tar.gz
