        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache-work
          FOXMES_BUILD_JOBS: '2'
          FOXMES_OBJECT_ARCHIVE: ${{ github.workspace }}/macos-objects-${{ matrix.shard }}.tar.gz
