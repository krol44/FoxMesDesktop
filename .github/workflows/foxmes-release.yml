          fi
      - name: Download macos-app
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: intermediate-macos-app
          path: ${{ runner.temp }}/foxmes-transfer
      - name: Restore the compiled macos app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/Release
          tar -xzf "$RUNNER_TEMP/foxmes-transfer/macos-app.tar.gz" -C out/Release
      - name: Import the signing certificate
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/foxmes-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" \
            -k "$keychain" -P "$SIGNING_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Sign the app and create the DMG
        shell: bash
        run: |
          bash Telegram/build/foxmes/build-macos.sh package
      - name: Remove the signing keychain
        if: ${{ always() && env.SIGNING_KEYCHAIN != '' }}
        shell: bash
        run: security delete-keychain "$SIGNING_KEYCHAIN"
      - name: Upload macOS package
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foxmes-macos
          path: artifacts/macos/*
          if-no-files-found: error

  linux-deps:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      CENTOS_ENV_REVISION: '1'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Resolve the centos_env image reference
        shell: bash
        env:
          DIGEST: "${{ hashFiles('Telegram/build/docker/centos_env/Dockerfile', 'Telegram/build/docker/centos_env/gen_dockerfile.py', 'Telegram/build/docker/centos_env/pyproject.toml', 'Telegram/build/docker/centos_env/poetry.lock') }}"
        run: |
          set -euo pipefail
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          suffix=
          if [ "$FOXMES_COLD_BUILD" = 1 ]; then suffix="-cold-$GITHUB_RUN_ID"; fi
          echo "FOXMES_CENTOS_ENV_IMAGE=ghcr.io/$repo/centos_env:$CENTOS_ENV_REVISION-$DIGEST$suffix" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Install build and validation prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils pipx
          pipx install poetry
      - name: Prepare the centos_env image
        shell: bash
        env:
          FOXMES_REQUIRE_IMAGE_PUBLISH: '1'
          FOXMES_REBUILD_IMAGE: ${{ env.FOXMES_COLD_BUILD }}
        run: bash Telegram/build/foxmes/build-linux.sh image
      - name: Record the prepared image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$(docker image inspect "$FOXMES_CENTOS_ENV_IMAGE" --format '{{index .RepoDigests 0}}')"
          [[ "$image" == ghcr.io/*@sha256:* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

  linux-prepare:
    needs: linux-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['prepare']
    permissions:
      contents: read
      packages: write
    env:
      FOXMES_CENTOS_ENV_IMAGE: ${{ needs.linux-deps.outputs.image }}
      FOXMES_REQUIRE_PREPARED_IMAGE: '1'
      FOXMES_SHARD_INDEX: ${{ matrix.shard }}
      FOXMES_SHARD_COUNT: '4'
      FOXMES_BUILD_ID: ${{ github.run_id }}-linux-${{ matrix.shard }}
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Log in to ghcr.io
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Restore the Linux compiler cache
        if: env.FOXMES_COLD_BUILD != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Linux-x64-ccache-shard-${{ matrix.shard }}-
      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - name: Prepare shared build objects
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
        run: bash Telegram/build/foxmes/build-linux.sh prepare
      - name: Stop the build container
        if: always()
        shell: bash
        run: docker ps -q --filter "label=foxmes-build=$FOXMES_BUILD_ID" | xargs -r docker kill
      - name: Save the Linux compiler cache
        if: env.FOXMES_COLD_BUILD != '1' && always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload linux prepared objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intermediate-linux-objects-${{ matrix.shard }}
          path: artifacts/transfer/linux-objects-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  linux-compile:
    needs: [linux-deps, linux-prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
      packages: write
    env:
      FOXMES_CENTOS_ENV_IMAGE: ${{ needs.linux-deps.outputs.image }}
      FOXMES_REQUIRE_PREPARED_IMAGE: '1'
      FOXMES_SHARD_INDEX: ${{ matrix.shard }}
      FOXMES_SHARD_COUNT: '4'
      FOXMES_BUILD_ID: ${{ github.run_id }}-linux-${{ matrix.shard }}
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Log in to ghcr.io
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Download shared linux build objects
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: intermediate-linux-objects-prepare
          path: ${{ runner.temp }}/foxmes-prepare
      - name: Restore the Linux compiler cache
        if: env.FOXMES_COLD_BUILD != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Linux-x64-ccache-shard-${{ matrix.shard }}-
      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - name: Compile the object shard
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
          FOXMES_PREPARED_OBJECTS_DIR: ${{ runner.temp }}/foxmes-prepare
        run: bash Telegram/build/foxmes/build-linux.sh shard
      - name: Stop the build container
        if: always()
        shell: bash
        run: docker ps -q --filter "label=foxmes-build=$FOXMES_BUILD_ID" | xargs -r docker kill
      - name: Save the Linux compiler cache
        if: env.FOXMES_COLD_BUILD != '1' && always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload linux object shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intermediate-linux-objects-${{ matrix.shard }}
          path: artifacts/transfer/linux-objects-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  linux-build:
    needs: [linux-deps, linux-prepare, linux-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      FOXMES_CENTOS_ENV_IMAGE: ${{ needs.linux-deps.outputs.image }}
      FOXMES_REQUIRE_PREPARED_IMAGE: '1'
      FOXMES_BUILD_ID: ${{ github.run_id }}-linux-link
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Log in to ghcr.io
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Download linux object shards
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: intermediate-linux-objects-*
          merge-multiple: true
          path: ${{ runner.temp }}/foxmes-objects
      - name: Budget the link step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - name: Link the imported objects
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          FOXMES_OBJECTS_DIR: ${{ runner.temp }}/foxmes-objects
        run: bash Telegram/build/foxmes/build-linux.sh link
      - name: Stop the build container
        if: always()
        shell: bash
        run: docker ps -q --filter "label=foxmes-build=$FOXMES_BUILD_ID" | xargs -r docker kill
      - name: Archive the compiled linux app
        if: ${{ github.event.inputs.only_cache != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf linux-app.tar.gz -C out FoxMes.AppDir
      - name: Upload linux-app
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intermediate-linux-app
          path: linux-app.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  linux:
    needs: linux-build
    if: ${{ github.event.inputs.only_cache != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install validation prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils
      - name: Download linux-app
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: intermediate-linux-app
          path: ${{ runner.temp }}/foxmes-transfer
      - name: Restore the compiled linux app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -xzf "$RUNNER_TEMP/foxmes-transfer/linux-app.tar.gz" -C out
      - name: Build Linux packages
        shell: bash
        run: |
          bash Telegram/build/foxmes/build-linux.sh package
      - name: Validate Linux package metadata
        shell: bash
        run: |
          desktop-file-validate out/FoxMes.AppDir/usr/share/applications/ing.foxtail.FoxMes.desktop
          appstreamcli validate --no-net out/FoxMes.AppDir/usr/share/metainfo/ing.foxtail.FoxMes.metainfo.xml
          artifacts/linux/FoxMes-1.13.5-linux-x86_64.AppImage --appimage-extract >/dev/null
          ldd out/FoxMes.AppDir/usr/bin/FoxMes | tee /tmp/foxmes-ldd.txt
          ! grep -q 'not found' /tmp/foxmes-ldd.txt
      - name: Upload Linux packages
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foxmes-linux
          path: artifacts/linux/*
          if-no-files-found: error

  # Caches saved by a tag run are visible only to that tag, so the compiler
  # caches the next release starts from are refreshed by a run on the default branch.

  refresh-caches:
    if: ${{ github.event.inputs.cold_build != 'true' && !cancelled() && needs.validate.result == 'success' && github.ref_type == 'tag' }}
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start a cache-only run on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          gh workflow run foxmes-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f only_cache=true

  cleanup-caches:
    if: ${{ github.event.inputs.cold_build != 'true' && !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [windows-deps, windows-prepare, windows-compile, windows-build, macos-deps, macos-prepare, macos-compile, macos-build, linux-deps, linux-prepare, linux-compile, linux-build, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete caches that later runs cannot use
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$GITHUB_REF"
          stale() {
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$ref" \
              --limit 100 --sort created_at --order desc "$@"
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The cache service files a tag's caches under
            # refs/heads/refs/tags/<tag>, and the plain tag ref matches none.
            ids="$(for ref in "$GITHUB_REF" "refs/heads/$GITHUB_REF"; do
              stale --json id --jq '.[].id'
            done)"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            ids="$(for prefix in Windows-x64-ccache- macOS-arm64-ccache- Linux-x64-ccache-; do
              for shard in prepare 0 1 2 3; do
                stale --key "${prefix}shard-$shard-" --json id --jq '.[1:][].id'
              done
              stale --key "$prefix" --json id,key --jq '.[] | select(.key | contains("-ccache-shard-") | not) | .id'
            done; stale --key Linux-ccache- --json id --jq '.[].id')"
          else
            ids=
          fi
          for id in $ids; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

  provenance:
    if: ${{ !cancelled() && github.event.inputs.only_cache != 'true' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download platform packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: foxmes-*
          path: release
          merge-multiple: true
      - name: Create version manifest and checksums
        shell: bash
        run: |
          python3 Telegram/build/foxmes/make-release-manifest.py release
          cd release
          sha256sum --check --strict SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: release/*
      - name: Upload complete release set
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foxmes-release
          path: release/*
          if-no-files-found: error

  publish:
    if: ${{ github.event.inputs.cold_build != 'true' && !cancelled() && github.ref_type == 'tag' && needs.provenance.result == 'success' }}
    needs: provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download complete release set
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: foxmes-release
          path: release
      - name: Build release notes
        shell: bash
        run: |
          python3 Telegram/build/foxmes/make-release-notes.py \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "FoxMes Desktop $FOXMES_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
