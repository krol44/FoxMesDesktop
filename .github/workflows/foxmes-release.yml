name: FoxMes Desktop release

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: Build the dependencies, populate the caches and stop.
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: foxmes-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FOXMES_DEPS_REVISION: '1'
  FOXMES_VERSION: 1.12.3
  FOXMES_VERSION_CODE: '1012003'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Validate product metadata and tag
        shell: bash
        run: |
          python3 Telegram/build/foxmes/verify-source.py
          python3 Telegram/build/foxmes/make-release-notes.py >/dev/null
          test "$(awk '$1 == "AppVersion" { print $2 }' Telegram/build/version)" = "$FOXMES_VERSION_CODE"
          test "$(awk '$1 == "AppVersionStr" { print $2 }' Telegram/build/version)" = "$FOXMES_VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$FOXMES_VERSION"
          fi

  # Each platform runs twice. The -cache job brings the dependencies and the
  # compiler cache up to date and saves them even when its compile step runs
  # out of time; the packaging job then starts from that cache with a fresh
  # six-hour limit, so a lost cache costs time instead of failing the release.
  windows-cache:
    needs: validate
    runs-on: windows-2025
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out submodules with LF endings
        shell: cmd
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Resolve the dependency roots and cache key
        shell: bash
        env:
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          TBUILD="$(cd "$GITHUB_WORKSPACE/.." && pwd -W)"
          echo "TBUILD=$TBUILD" >> "$GITHUB_ENV"
          echo "LibrariesPath=$TBUILD/Libraries/win64" >> "$GITHUB_ENV"

          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          test -x "$vswhere" || { echo "vswhere.exe was not found."; exit 1; }
          vspath="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          test -n "$vspath" || { echo "No Visual Studio installation was found."; exit 1; }
          build_dir="$(cygpath -u "$vspath")/VC/Auxiliary/Build"
          toolset_file="$build_dir/Microsoft.VCToolsVersion.v143.default.txt"
          test -f "$toolset_file" || toolset_file="$build_dir/Microsoft.VCToolsVersion.default.txt"
          test -f "$toolset_file" || { echo "No toolset version file under $build_dir."; exit 1; }
          echo "Toolset version file: $toolset_file"
          toolset="$(tr -d ' \r\n' < "$toolset_file")"
          test -n "$toolset" || { echo "$toolset_file is empty."; exit 1; }
          echo "Caching against MSVC toolset $toolset"

          { echo "$DEPS_DIGEST"; echo "$FOXMES_DEPS_REVISION"; echo "$toolset"; } \
            > "$RUNNER_TEMP/cache_key.txt"
          echo "CACHE_KEY=$(sha256sum "$RUNNER_TEMP/cache_key.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Restore the ThirdParty cache
        id: tp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-third-party-

      - name: Restore the Libraries cache
        id: libs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-libs-

      - name: Restore the Qt cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-qt-${{ env.CACHE_KEY }}

      - name: Install ccache
        shell: pwsh
        env:
          CCACHE_VERSION: 4.14.2
          CCACHE_SHA256: 6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
        run: |
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CCACHE_SHA256) { throw "ccache archive checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP $name)

      - name: Build dependencies
        id: deps
        shell: cmd
        env:
          FOXMES_PRUNE_LIBRARIES: '1'
        run: call Telegram\build\foxmes\build-windows.bat -DepsOnly

      - name: Save the ThirdParty cache
        if: always() && steps.deps.outcome == 'success' && steps.tp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}

      - name: Save the Libraries cache
        if: always() && steps.deps.outcome == 'success' && steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}

      - name: Save the Qt cache
        if: always() && steps.deps.outcome == 'success' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-qt-${{ env.CACHE_KEY }}

      - name: Restore the Windows compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Windows-x64-ccache-${{ github.run_id }}-
            Windows-x64-ccache-

      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Compile the app
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: cmd
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
          FOXMES_PRUNE_LIBRARIES: '1'
        run: call Telegram\build\foxmes\build-windows.bat -OnlyCache

      - name: Save the Windows compiler cache
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}

  windows:
    needs: [validate, windows-cache]
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event.inputs.only_cache != 'true' }}
    runs-on: windows-2025
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out submodules with LF endings
        shell: cmd
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Resolve the dependency roots and cache key
        shell: bash
        env:
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          TBUILD="$(cd "$GITHUB_WORKSPACE/.." && pwd -W)"
          echo "TBUILD=$TBUILD" >> "$GITHUB_ENV"
          echo "LibrariesPath=$TBUILD/Libraries/win64" >> "$GITHUB_ENV"

          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          test -x "$vswhere" || { echo "vswhere.exe was not found."; exit 1; }
          vspath="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          test -n "$vspath" || { echo "No Visual Studio installation was found."; exit 1; }
          build_dir="$(cygpath -u "$vspath")/VC/Auxiliary/Build"
          toolset_file="$build_dir/Microsoft.VCToolsVersion.v143.default.txt"
          test -f "$toolset_file" || toolset_file="$build_dir/Microsoft.VCToolsVersion.default.txt"
          test -f "$toolset_file" || { echo "No toolset version file under $build_dir."; exit 1; }
          echo "Toolset version file: $toolset_file"
          toolset="$(tr -d ' \r\n' < "$toolset_file")"
          test -n "$toolset" || { echo "$toolset_file is empty."; exit 1; }
          echo "Caching against MSVC toolset $toolset"

          { echo "$DEPS_DIGEST"; echo "$FOXMES_DEPS_REVISION"; echo "$toolset"; } \
            > "$RUNNER_TEMP/cache_key.txt"
          echo "CACHE_KEY=$(sha256sum "$RUNNER_TEMP/cache_key.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Restore the ThirdParty cache
        id: tp-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-third-party-

      - name: Restore the Libraries cache
        id: libs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-libs-

      - name: Restore the Qt cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-qt-${{ env.CACHE_KEY }}

      - name: Install ccache
        shell: pwsh
        env:
          CCACHE_VERSION: 4.14.2
          CCACHE_SHA256: 6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
        run: |
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CCACHE_SHA256) { throw "ccache archive checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP $name)

      - name: Restore the Windows compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Windows-x64-ccache-${{ github.run_id }}-
            Windows-x64-ccache-

      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Build unsigned Windows packages
        id: app
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: cmd
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
          FOXMES_PRUNE_LIBRARIES: '1'
        run: call Telegram\build\foxmes\build-windows.bat

      - name: Note whether the dependencies completed
        if: always()
        id: deps
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/foxmes-deps-complete" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the ThirdParty cache
        if: always() && steps.deps.outputs.ok == '1' && steps.tp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}

      - name: Save the Libraries cache
        if: always() && steps.deps.outputs.ok == '1' && steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}

      - name: Save the Qt cache
        if: always() && steps.deps.outputs.ok == '1' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-qt-${{ env.CACHE_KEY }}

      - name: Save the Windows compiler cache
        if: always() && steps.app.outcome == 'failure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}-build

      - name: Upload Windows packages
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foxmes-windows
          path: artifacts/windows/*
          if-no-files-found: error

  macos-cache:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Install build prerequisites
        shell: bash
        run: brew install automake ccache libtool meson nasm ninja pkg-config

      - name: Resolve the dependency root and cache key
        shell: bash
        env:
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          echo "TBUILD=$(dirname "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          {
            echo "$DEPS_DIGEST"
            echo "$FOXMES_DEPS_REVISION"
            sysctl -n hw.ncpu
          } > "$RUNNER_TEMP/cache_key.txt"
          echo "CACHE_KEY=$(shasum -a 256 "$RUNNER_TEMP/cache_key.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Restore the dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.TBUILD }}/Libraries
            ${{ env.TBUILD }}/ThirdParty
          key: macOS-arm64-libs-${{ env.CACHE_KEY }}
          restore-keys: macOS-arm64-libs-

      - name: Build dependencies
        id: deps
        shell: bash
        env:
          FOXMES_PRUNE_LIBRARIES: '1'
        run: bash Telegram/build/foxmes/build-macos.sh deps

      - name: Save the dependency cache
        if: always() && steps.deps.outcome == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.TBUILD }}/Libraries
            ${{ env.TBUILD }}/ThirdParty
          key: macOS-arm64-libs-${{ env.CACHE_KEY }}

      - name: Restore the macOS compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: macOS-arm64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macOS-arm64-ccache-${{ github.run_id }}-
            macOS-arm64-ccache-

      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Compile the app
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
        run: bash Telegram/build/foxmes/build-macos.sh compile

      - name: Save the macOS compiler cache
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: macOS-arm64-ccache-${{ github.run_id }}-${{ github.run_attempt }}

  macos:
    needs: [validate, macos-cache]
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event.inputs.only_cache != 'true' }}
    runs-on: macos-15
    environment: macos-signing
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Check the signing secrets
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ] || [ -z "$SIGNING_P12_PASSWORD" ]; then
            echo "MACOS_SIGNING_P12 and MACOS_SIGNING_P12_PASSWORD must be set in the macos-signing environment" >&2
            exit 1
          fi

      - name: Install build prerequisites
        shell: bash
        run: brew install automake ccache libtool meson nasm ninja pkg-config

      - name: Resolve the dependency root and cache key
        shell: bash
        env:
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          echo "TBUILD=$(dirname "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          {
            echo "$DEPS_DIGEST"
            echo "$FOXMES_DEPS_REVISION"
            sysctl -n hw.ncpu
          } > "$RUNNER_TEMP/cache_key.txt"
          echo "CACHE_KEY=$(shasum -a 256 "$RUNNER_TEMP/cache_key.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Restore the dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.TBUILD }}/Libraries
            ${{ env.TBUILD }}/ThirdParty
          key: macOS-arm64-libs-${{ env.CACHE_KEY }}
          restore-keys: macOS-arm64-libs-

      - name: Build dependencies
        id: deps
        shell: bash
        env:
          FOXMES_PRUNE_LIBRARIES: '1'
        run: bash Telegram/build/foxmes/build-macos.sh deps

      - name: Save the dependency cache
        if: always() && steps.deps.outcome == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.TBUILD }}/Libraries
            ${{ env.TBUILD }}/ThirdParty
          key: macOS-arm64-libs-${{ env.CACHE_KEY }}

      - name: Import the signing certificate
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/foxmes-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" \
            -k "$keychain" -P "$SIGNING_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Restore the macOS compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: macOS-arm64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macOS-arm64-ccache-${{ github.run_id }}-
            macOS-arm64-ccache-

      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Build the macOS package
        id: app
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
        run: bash Telegram/build/foxmes/build-macos.sh app

      - name: Save the macOS compiler cache
        if: always() && steps.app.outcome == 'failure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: macOS-arm64-ccache-${{ github.run_id }}-${{ github.run_attempt }}-build

      - name: Remove the signing keychain
        if: ${{ always() && env.SIGNING_KEYCHAIN != '' }}
        shell: bash
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      - name: Upload macOS package
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foxmes-macos
          path: artifacts/macos/*
          if-no-files-found: error

  linux-cache:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CENTOS_ENV_REVISION: '1'
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Resolve the centos_env image reference
        shell: bash
        env:
          DIGEST: "${{ hashFiles('Telegram/build/docker/centos_env/Dockerfile', 'Telegram/build/docker/centos_env/gen_dockerfile.py', 'Telegram/build/docker/centos_env/pyproject.toml', 'Telegram/build/docker/centos_env/poetry.lock') }}"
        run: |
          set -euo pipefail
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "FOXMES_CENTOS_ENV_IMAGE=ghcr.io/$repo/centos_env:$CENTOS_ENV_REVISION-$DIGEST" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Install build and validation prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils pipx
          pipx install poetry

      - name: Prepare the centos_env image
        shell: bash
        run: bash Telegram/build/foxmes/build-linux.sh image

      - name: Restore the Linux compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Linux-x64-ccache-${{ github.run_id }}-
            Linux-x64-ccache-

      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Compile the app
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
        run: bash Telegram/build/foxmes/build-linux.sh compile

      - name: Stop the build container
        if: always()
        shell: bash
        run: docker ps -q | xargs -r docker kill

      - name: Save the Linux compiler cache
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}

  linux:
    needs: [validate, linux-cache]
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event.inputs.only_cache != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CENTOS_ENV_REVISION: '1'
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Resolve the centos_env image reference
        shell: bash
        env:
          DIGEST: "${{ hashFiles('Telegram/build/docker/centos_env/Dockerfile', 'Telegram/build/docker/centos_env/gen_dockerfile.py', 'Telegram/build/docker/centos_env/pyproject.toml', 'Telegram/build/docker/centos_env/poetry.lock') }}"
        run: |
          set -euo pipefail
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "FOXMES_CENTOS_ENV_IMAGE=ghcr.io/$repo/centos_env:$CENTOS_ENV_REVISION-$DIGEST" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Install build and validation prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils pipx
          pipx install poetry

      - name: Restore the Linux compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Linux-x64-ccache-${{ github.run_id }}-
            Linux-x64-ccache-

      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Build Linux packages
        id: app
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
        run: bash Telegram/build/foxmes/build-linux.sh

      - name: Stop the build container
        if: always()
        shell: bash
        run: docker ps -q | xargs -r docker kill

      - name: Save the Linux compiler cache
        if: always() && steps.app.outcome == 'failure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Linux-x64-ccache-${{ github.run_id }}-${{ github.run_attempt }}-build

      - name: Validate Linux package metadata
        shell: bash
        run: |
          desktop-file-validate out/FoxMes.AppDir/usr/share/applications/ing.foxtail.FoxMes.desktop
          appstreamcli validate --no-net out/FoxMes.AppDir/usr/share/metainfo/ing.foxtail.FoxMes.metainfo.xml
          artifacts/linux/FoxMes-1.12.3-linux-x86_64.AppImage --appimage-extract >/dev/null
          ldd out/FoxMes.AppDir/usr/bin/FoxMes | tee /tmp/foxmes-ldd.txt
          ! grep -q 'not found' /tmp/foxmes-ldd.txt
      - name: Upload Linux packages
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foxmes-linux
          path: artifacts/linux/*
          if-no-files-found: error

  # Caches saved by a tag run are visible only to that tag, so the compiler
  # caches the next release starts from are refreshed by a run on the default branch.
  refresh-caches:
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.ref_type == 'tag' }}
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start a cache-only run on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          gh workflow run foxmes-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f only_cache=true

  # A tag's caches serve only that run and its re-runs, so they go once it
  # succeeds; on the default branch only the newest compiler cache is kept.
  cleanup-caches:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [windows-cache, macos-cache, linux-cache, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete caches that later runs cannot use
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$GITHUB_REF"
          stale() {
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$ref" \
              --limit 100 --sort created_at --order desc "$@"
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The cache service files a tag's caches under
            # refs/heads/refs/tags/<tag>, and the plain tag ref matches none.
            ids="$(for ref in "$GITHUB_REF" "refs/heads/$GITHUB_REF"; do
              stale --json id --jq '.[].id'
            done)"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            ids="$(for prefix in Windows-x64-ccache- macOS-arm64-ccache- Linux-x64-ccache-; do
              stale --key "$prefix" --json id --jq '.[1:][].id'
            done; stale --key Linux-ccache- --json id --jq '.[].id')"
          else
            ids=
          fi
          for id in $ids; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

  provenance:
    if: ${{ !cancelled() && github.event.inputs.only_cache != 'true' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download platform packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: foxmes-*
          path: release
          merge-multiple: true
      - name: Create version manifest and checksums
        shell: bash
        run: |
          python3 Telegram/build/foxmes/make-release-manifest.py release
          cd release
          sha256sum --check --strict SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: release/*
      - name: Upload complete release set
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foxmes-release
          path: release/*
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.provenance.result == 'success' }}
    needs: provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download complete release set
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: foxmes-release
          path: release
      - name: Build release notes
        shell: bash
        run: |
          python3 Telegram/build/foxmes/make-release-notes.py \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "FoxMes Desktop $FOXMES_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
