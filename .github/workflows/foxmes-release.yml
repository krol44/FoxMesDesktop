        shell: pwsh
        run: |
          & .\Telegram\build\foxmes\build-windows.ps1 -PackageOnly
      - name: Upload Windows packages
        if: ${{ github.event.inputs.only_cache != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
