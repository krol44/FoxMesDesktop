name: FoxMes Desktop release

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: Build the dependencies, populate the caches and stop.
        type: boolean
        default: false
      cold_build:
        description: Build dependencies and all object shards without caches; upload packages without publishing a release.
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: foxmes-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FOXMES_DEPS_REVISION: '1'
  FOXMES_COLD_BUILD: ${{ github.event.inputs.cold_build == 'true' && '1' || '0' }}
  FOXMES_VERSION: 1.13.5
  FOXMES_VERSION_CODE: '1013005'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Install distributed build test prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build qt6-base-dev-tools
      - name: Test distributed object transfer
        shell: bash
        env:
          FOXMES_TEST_RCC: /usr/lib/qt6/libexec/rcc
        run: python3 -m unittest discover -s Telegram/build/foxmes/tests -v
      - name: Validate product metadata and tag
        shell: bash
        run: |
          python3 Telegram/build/foxmes/verify-source.py
          python3 Telegram/build/foxmes/make-release-notes.py >/dev/null
          test "$(awk '$1 == "AppVersion" { print $2 }' Telegram/build/version)" = "$FOXMES_VERSION_CODE"
          test "$(awk '$1 == "AppVersionStr" { print $2 }' Telegram/build/version)" = "$FOXMES_VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$FOXMES_VERSION"
          fi

  windows-deps:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 360
    outputs:
      artifact_digest: ${{ steps.prepared-deps.outputs.artifact-digest }}
      toolset: ${{ steps.toolchain.outputs.toolset }}
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out submodules with LF endings
        shell: cmd
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Resolve the dependency roots and cache key
        id: toolchain
        shell: bash
        env:
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          TBUILD="$(cd "$GITHUB_WORKSPACE/.." && pwd -W)"
          echo "TBUILD=$TBUILD" >> "$GITHUB_ENV"
          echo "LibrariesPath=$TBUILD/Libraries/win64" >> "$GITHUB_ENV"

          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          test -x "$vswhere" || { echo "vswhere.exe was not found."; exit 1; }
          vspath="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          test -n "$vspath" || { echo "No Visual Studio installation was found."; exit 1; }
          build_dir="$(cygpath -u "$vspath")/VC/Auxiliary/Build"
          toolset_file="$build_dir/Microsoft.VCToolsVersion.v143.default.txt"
          test -f "$toolset_file" || toolset_file="$build_dir/Microsoft.VCToolsVersion.default.txt"
          test -f "$toolset_file" || { echo "No toolset version file under $build_dir."; exit 1; }
          echo "Toolset version file: $toolset_file"
          toolset="$(tr -d ' \r\n' < "$toolset_file")"
          test -n "$toolset" || { echo "$toolset_file is empty."; exit 1; }
          echo "Caching against MSVC toolset $toolset"
          echo "FOXMES_MSVC_TOOLSET=$toolset" >> "$GITHUB_ENV"
          echo "toolset=$toolset" >> "$GITHUB_OUTPUT"

          { echo "$DEPS_DIGEST"; echo "$FOXMES_DEPS_REVISION"; echo "$toolset"; } \
            > "$RUNNER_TEMP/cache_key.txt"
          echo "CACHE_KEY=$(sha256sum "$RUNNER_TEMP/cache_key.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Restore the ThirdParty cache
        id: tp-cache
        if: env.FOXMES_COLD_BUILD != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-third-party-
      - name: Restore the Libraries cache
        id: libs-cache
        if: env.FOXMES_COLD_BUILD != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-libs-
      - name: Restore the Qt cache
        id: qt-cache
        if: env.FOXMES_COLD_BUILD != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-qt-${{ env.CACHE_KEY }}
      - name: Build dependencies
        id: deps
        shell: cmd
        env:
          FOXMES_PRUNE_LIBRARIES: '1'
        run: call Telegram\build\foxmes\build-windows.bat -DepsOnly
      - name: Save the ThirdParty cache
        if: env.FOXMES_COLD_BUILD != '1' && always() && steps.deps.outcome == 'success' && steps.tp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}
      - name: Save the Libraries cache
        if: env.FOXMES_COLD_BUILD != '1' && always() && steps.deps.outcome == 'success' && steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}
      - name: Save the Qt cache
        if: env.FOXMES_COLD_BUILD != '1' && always() && steps.deps.outcome == 'success' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-qt-${{ env.CACHE_KEY }}
      - name: Archive windows dependencies
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CACHE_KEY" > "$(cygpath -u "$TBUILD")/foxmes-deps-key.txt"
          tar --dereference --hard-dereference -czf windows-deps.tar.gz -C "$(cygpath -u "$TBUILD")" Libraries ThirdParty foxmes-deps-key.txt
          python - <<'PYCODE'
          import tarfile
          with tarfile.open("windows-deps.tar.gz", "r:gz") as archive:
              for entry in archive:
                  if entry.issym() or entry.islnk():
                      raise SystemExit("Windows dependency archive contains a link: " + entry.name)
          print("Windows dependency archive contains no symbolic or hard links.")
          PYCODE
      - name: Upload windows-deps
        id: prepared-deps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intermediate-windows-deps
          path: windows-deps.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  windows-prepare:
    needs: windows-deps
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['prepare']
    env:
      FOXMES_SHARD_INDEX: ${{ matrix.shard }}
      FOXMES_SHARD_COUNT: '4'
      FOXMES_DEPENDENCY_CONTEXT: ${{ needs.windows-deps.outputs.artifact_digest }}
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out submodules with LF endings
        shell: cmd
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Resolve the dependency roots and cache key
        shell: bash
        env:
          PREPARED_TOOLSET: ${{ needs.windows-deps.outputs.toolset }}
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          TBUILD="$(cd "$GITHUB_WORKSPACE/.." && pwd -W)"
          echo "TBUILD=$TBUILD" >> "$GITHUB_ENV"
          echo "LibrariesPath=$TBUILD/Libraries/win64" >> "$GITHUB_ENV"

          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          test -x "$vswhere" || { echo "vswhere.exe was not found."; exit 1; }
          vspath="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          test -n "$vspath" || { echo "No Visual Studio installation was found."; exit 1; }
          build_dir="$(cygpath -u "$vspath")/VC/Auxiliary/Build"
          toolset_file="$build_dir/Microsoft.VCToolsVersion.v143.default.txt"
          test -f "$toolset_file" || toolset_file="$build_dir/Microsoft.VCToolsVersion.default.txt"
          test -f "$toolset_file" || { echo "No toolset version file under $build_dir."; exit 1; }
          echo "Toolset version file: $toolset_file"
          toolset="$(tr -d ' \r\n' < "$toolset_file")"
          test -n "$toolset" || { echo "$toolset_file is empty."; exit 1; }
          if [ -n "${PREPARED_TOOLSET:-}" ] && [ -x "$(cygpath -u "$vspath")/VC/Tools/MSVC/$PREPARED_TOOLSET/bin/Hostx64/x64/cl.exe" ]; then
            toolset="$PREPARED_TOOLSET"
          fi
          echo "Caching against MSVC toolset $toolset"
          echo "FOXMES_MSVC_TOOLSET=$toolset" >> "$GITHUB_ENV"

          { echo "$DEPS_DIGEST"; echo "$FOXMES_DEPS_REVISION"; echo "$toolset"; } \
            > "$RUNNER_TEMP/cache_key.txt"
          echo "CACHE_KEY=$(sha256sum "$RUNNER_TEMP/cache_key.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Download windows-deps
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: intermediate-windows-deps
          path: ${{ runner.temp }}/foxmes-transfer
      - name: Restore prepared windows dependencies
        id: deps-transfer
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$(cygpath -u "$RUNNER_TEMP")/foxmes-transfer/windows-deps.tar.gz" -C "$(cygpath -u "$TBUILD")"
          if [ "$(cat "$(cygpath -u "$TBUILD")/foxmes-deps-key.txt")" != "$CACHE_KEY" ]; then
            echo "Prepared dependencies do not match this runner toolchain." >&2
            exit 1
          fi
      - name: Install ccache
        if: env.FOXMES_COLD_BUILD != '1'
        shell: pwsh
        env:
          CCACHE_VERSION: 4.14.2
          CCACHE_SHA256: 6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
        run: |
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CCACHE_SHA256) { throw "ccache archive checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP $name)
      - name: Restore the Windows compiler cache
        if: env.FOXMES_COLD_BUILD != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Windows-x64-ccache-shard-${{ matrix.shard }}-
      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - name: Prepare shared build objects
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: cmd
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
          FOXMES_PRUNE_LIBRARIES: '1'
          FOXMES_OBJECT_ARCHIVE: ${{ github.workspace }}/windows-objects-${{ matrix.shard }}.tar.gz
        run: call Telegram\build\foxmes\build-windows.bat -PrepareObjects -SkipDeps
      - name: Save the Windows compiler cache
        if: env.FOXMES_COLD_BUILD != '1' && always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload windows prepared objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intermediate-windows-objects-${{ matrix.shard }}
          path: windows-objects-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  windows-compile:
    needs: [windows-deps, windows-prepare]
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FOXMES_SHARD_INDEX: ${{ matrix.shard }}
      FOXMES_SHARD_COUNT: '4'
      FOXMES_DEPENDENCY_CONTEXT: ${{ needs.windows-deps.outputs.artifact_digest }}
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out submodules with LF endings
        shell: cmd
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Resolve the dependency roots and cache key
        shell: bash
        env:
          PREPARED_TOOLSET: ${{ needs.windows-deps.outputs.toolset }}
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          TBUILD="$(cd "$GITHUB_WORKSPACE/.." && pwd -W)"
          echo "TBUILD=$TBUILD" >> "$GITHUB_ENV"
          echo "LibrariesPath=$TBUILD/Libraries/win64" >> "$GITHUB_ENV"

          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          test -x "$vswhere" || { echo "vswhere.exe was not found."; exit 1; }
          vspath="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          test -n "$vspath" || { echo "No Visual Studio installation was found."; exit 1; }
          build_dir="$(cygpath -u "$vspath")/VC/Auxiliary/Build"
          toolset_file="$build_dir/Microsoft.VCToolsVersion.v143.default.txt"
          test -f "$toolset_file" || toolset_file="$build_dir/Microsoft.VCToolsVersion.default.txt"
          test -f "$toolset_file" || { echo "No toolset version file under $build_dir."; exit 1; }
          echo "Toolset version file: $toolset_file"
          toolset="$(tr -d ' \r\n' < "$toolset_file")"
          test -n "$toolset" || { echo "$toolset_file is empty."; exit 1; }
          if [ -n "${PREPARED_TOOLSET:-}" ] && [ -x "$(cygpath -u "$vspath")/VC/Tools/MSVC/$PREPARED_TOOLSET/bin/Hostx64/x64/cl.exe" ]; then
            toolset="$PREPARED_TOOLSET"
          fi
          echo "Caching against MSVC toolset $toolset"
          echo "FOXMES_MSVC_TOOLSET=$toolset" >> "$GITHUB_ENV"

          { echo "$DEPS_DIGEST"; echo "$FOXMES_DEPS_REVISION"; echo "$toolset"; } \
            > "$RUNNER_TEMP/cache_key.txt"
          echo "CACHE_KEY=$(sha256sum "$RUNNER_TEMP/cache_key.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Download windows-deps
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: intermediate-windows-deps
          path: ${{ runner.temp }}/foxmes-transfer
      - name: Restore prepared windows dependencies
        id: deps-transfer
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$(cygpath -u "$RUNNER_TEMP")/foxmes-transfer/windows-deps.tar.gz" -C "$(cygpath -u "$TBUILD")"
          if [ "$(cat "$(cygpath -u "$TBUILD")/foxmes-deps-key.txt")" != "$CACHE_KEY" ]; then
            echo "Prepared dependencies do not match this runner toolchain." >&2
            exit 1
          fi
      - name: Install ccache
        if: env.FOXMES_COLD_BUILD != '1'
        shell: pwsh
        env:
          CCACHE_VERSION: 4.14.2
          CCACHE_SHA256: 6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
        run: |
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CCACHE_SHA256) { throw "ccache archive checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP $name)
      - name: Download shared windows build objects
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: intermediate-windows-objects-prepare
          path: ${{ runner.temp }}/foxmes-prepare
      - name: Restore the Windows compiler cache
        if: env.FOXMES_COLD_BUILD != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Windows-x64-ccache-shard-${{ matrix.shard }}-
      - name: Budget the compile step
        id: budget
        shell: bash
        run: |
          minutes=$(( 330 - ($(date +%s) - JOB_STARTED) / 60 ))
          [ "$minutes" -ge 15 ] || minutes=15
          echo "The compile step may run for $minutes minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - name: Compile the object shard
        id: compile
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: cmd
        env:
          FOXMES_CCACHE_DIR: ${{ runner.temp }}/foxmes-ccache
          FOXMES_PREPARED_OBJECTS_DIR: ${{ runner.temp }}/foxmes-prepare
          FOXMES_PRUNE_LIBRARIES: '1'
          FOXMES_OBJECT_ARCHIVE: ${{ github.workspace }}/windows-objects-${{ matrix.shard }}.tar.gz
        run: call Telegram\build\foxmes\build-windows.bat -CompileShard -SkipDeps
      - name: Save the Windows compiler cache
        if: env.FOXMES_COLD_BUILD != '1' && always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/foxmes-ccache
          key: Windows-x64-ccache-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload windows object shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intermediate-windows-objects-${{ matrix.shard }}
          path: windows-objects-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  windows-build:
    needs: [windows-deps, windows-prepare, windows-compile]
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      FOXMES_DEPENDENCY_CONTEXT: ${{ needs.windows-deps.outputs.artifact_digest }}
    steps:
      - name: Record the job start
        shell: bash
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out submodules with LF endings
        shell: cmd
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
      - name: Resolve the dependency roots and cache key
        shell: bash
        env:
          PREPARED_TOOLSET: ${{ needs.windows-deps.outputs.toolset }}
          DEPS_DIGEST: "${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}"
        run: |
          set -euo pipefail
          TBUILD="$(cd "$GITHUB_WORKSPACE/.." && pwd -W)"
          echo "TBUILD=$TBUILD" >> "$GITHUB_ENV"
          echo "LibrariesPath=$TBUILD/Libraries/win64" >> "$GITHUB_ENV"

          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          test -x "$vswhere" || { echo "vswhere.exe was not found."; exit 1; }
          vspath="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          test -n "$vspath" || { echo "No Visual Studio installation was found."; exit 1; }
          build_dir="$(cygpath -u "$vspath")/VC/Auxiliary/Build"
          toolset_file="$build_dir/Microsoft.VCToolsVersion.v143.default.txt"
          test -f "$toolset_file" || toolset_file="$build_dir/Microsoft.VCToolsVersion.default.txt"
          test -f "$toolset_file" || { echo "No toolset version file under $build_dir."; exit 1; }
          echo "Toolset version file: $toolset_file"
          toolset="$(tr -d ' \r\n' < "$toolset_file")"
          test -n "$toolset" || { echo "$toolset_file is empty."; exit 1; }
          if [ -n "${PREPARED_TOOLSET:-}" ] && [ -x "$(cygpath -u "$vspath")/VC/Tools/MSVC/$PREPARED_TOOLSET/bin/Hostx64/x64/cl.exe" ]; then
            toolset="$PREPARED_TOOLSET"
          fi
          echo "Caching against MSVC toolset $toolset"
          echo "FOXMES_MSVC_TOOLSET=$toolset" >> "$GITHUB_ENV"

          { echo "$DEPS_DIGEST"; echo "$FOXMES_DEPS_REVISION"; echo "$toolset"; } \
            > "$RUNNER_TEMP/cache_key.txt"
